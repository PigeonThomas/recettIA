# Configuration Nginx pour servir l'application Symfony.
# Nginx sert les fichiers statiques directement et transmet tout le reste
# (les vraies pages) au conteneur PHP-FPM via FastCGI.
server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    location / {
        # try_files cherche d'abord un fichier statique existant, sinon
        # transmet la requête à index.php (front controller Symfony).
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # Empêche l'accès direct à d'autres fichiers .php (sécurité).
    location ~ \.php$ {
        return 404;
    }
}
